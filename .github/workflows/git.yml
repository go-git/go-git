name: Git Compatibility
on:
  workflow_dispatch:
  push:
    branches:
    - releases/v5.x
    - main
    paths-ignore:
    - '**.md'
    - 'rfcs/**'
  pull_request:
    paths-ignore:
    - '**.md'
    - 'rfcs/**'

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        git: [[master, ubuntu-latest], [v2.11.0, ubuntu-latest]]

    runs-on: ${{ matrix.git[1] }}
    env:
        GIT_VERSION: ${{ matrix.git[0] }}
        GIT_DIST_PATH: .git-dist/${{ matrix.git[0] }}

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install gettext libcurl4-openssl-dev

    - name: Git Build
      run: make build-git
      env:
        # Git v2.11.0's http.h redefines CURLUSESSL_TRY as CURLFTPSSL_TRY
        # unless CURLOPT_USE_SSL is a macro. Newer curl headers define both
        # as macros in terms of each other, which breaks the build. Defining
        # CURLOPT_USE_SSL to itself skips that compatibility block.
        CPPFLAGS: ${{ matrix.git[0] == 'v2.11.0' && '-DCURLOPT_USE_SSL=CURLOPT_USE_SSL' || '' }}
        # Newer GCC defaults to C23, which Git v2.11.0 predates. It declares
        # a struct thread_local, now a keyword, and an unreachable()
        # function, now a stddef.h macro. Build it as C11 instead. An empty
        # CFLAGS would drop configure's default -g -O2, so set it explicitly.
        CFLAGS: ${{ matrix.git[0] == 'v2.11.0' && '-g -O2 -std=gnu11' || '-g -O2' }}

    - name: Set Git config environment variables
      run: |
        echo "GIT_DIST_PATH=.git-dist/${{ matrix.git[0] }}" >> $GITHUB_ENV
        echo "GIT_EXEC_PATH=${{ github.workspace }}/$GIT_DIST_PATH" >> $GITHUB_ENV
        echo "PATH=${{ github.workspace }}/$GIT_DIST_PATH:$PATH" >> $GITHUB_ENV

    - name: Verify Git installation
      run: |
        exec_path=$(git --exec-path)
        echo "Git exec path: $exec_path"
        if [ "$exec_path" != "${{ github.workspace }}/.git-dist/${{ matrix.git[0] }}" ]; then
          echo "Git exec path mismatch: expected ${{ github.workspace }}/.git-dist/${{ matrix.git[0] }}, got $exec_path"
          exit 1
        fi

    - name: Test
      run: make test-coverage

    - name: Build go-git with CGO disabled
      run: go build ./...
      env:
        CGO_ENABLED: 0
